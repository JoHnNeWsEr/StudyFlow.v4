name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Allow exact reminder alarms
        run: sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /><uses-permission android:name="android.permission.USE_EXACT_ALARM" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" /><application|' android/app/src/main/AndroidManifest.xml
      - name: Apply app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-res/* android/app/src/main/res/
      - name: Prepare notification sounds
        run: bash scripts/prepare-sounds.sh
      - name: Use permanent signing key (keeps your data on updates)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
